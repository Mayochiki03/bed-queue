# =====================================================================
# SonarQube — สแกนคุณภาพโค้ด (ใช้กับ SonarQube ใน DevOps lab)
#
# ห้ามใส่ token ในไฟล์นี้ (ไฟล์นี้ขึ้น GitHub) — ส่ง token ตอนรันเท่านั้น:
#   npm run test:coverage -w backend      (สร้าง backend/coverage/lcov.info)
#   npx sonarqube-scanner "-Dsonar.host.url=http://192.168.56.128:9000" "-Dsonar.login=<token>"
#   (SonarQube 9.9 ใช้ sonar.login — ใน PowerShell ต้องครอบ -D... ด้วย " ")
# =====================================================================
sonar.projectKey=bed-queue
sonar.projectName=Bed Queue
sonar.projectVersion=0.3.3

sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-liff/**,**/coverage/**,**/*.min.js,frontend/public/**

sonar.tests=backend/test
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# frontend ไม่นับ coverage: test เป็น integration test ยิง API (วัดได้เฉพาะ backend)
sonar.coverage.exclusions=frontend/**

# SonarQube 9.9 ใช้ TypeScript รุ่นเก่า (ไม่รู้จัก moduleResolution "Bundler") → ใช้ tsconfig เฉพาะตอนสแกนแทน
sonar.typescript.tsconfigPaths=backend/tsconfig.sonar.json,frontend/tsconfig.sonar.json

# @theme เป็นคำสั่งของ Tailwind v4 ไม่ใช่ CSS มาตรฐาน SonarQube จึงฟ้อง (false positive)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/**/*.css
